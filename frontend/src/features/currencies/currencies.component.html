<div class="coins-header">
    <div></div>
    <div>title</div>
    <div>price</div>
</div>

<div *ngIf="coins().length > 0">
    <div *ngFor="let coin of coins()" class="coin-box">
        <img [src]="coin.image" class="coin-box__img" />
        <div>{{coin.name}}</div>
        <div>{{coin.current_price}} &euro;</div>
    </div>
</div>
