<div class="form-wrapper">
    <h2>Create an account</h2>
    <form [formGroup]="signupForm" class="signup-form" (submit)="handleSubmit()">
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput placeholder="enter username" formControlName="username" required />
        </mat-form-field>
        <div *ngIf="signupForm.get('username')?.invalid && signupForm.get('username')?.touched" class="error-message">
            <div *ngIf="signupForm.get('username')?.hasError('required')">
                Name is required.
            </div>
            <div *ngIf="signupForm.get('username')?.hasError('minlength')">
                Name must be at least 3 characters long.
            </div>
        </div>
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput placeholder="enter email" formControlName="email" required type="email" />
        </mat-form-field>
        <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="error-message">
            <div *ngIf="signupForm.get('email')?.hasError('required')">
                Email is required.
            </div>
            <div *ngIf="signupForm.get('email')?.hasError('email')">
                Email is incorrect.
            </div>
        </div>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput placeholder="enter password" formControlName="password" type="password" required />
        </mat-form-field>
        <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="error-message">
            <div *ngIf="signupForm.get('password')?.hasError('required')">
                Password is required.
            </div>
            <div *ngIf="signupForm.get('password')?.hasError('minlength')">
                Password must be at least 6 characters long.
            </div>
        </div>
        <mat-form-field>
            <mat-label>Confirm password</mat-label>
            <input matInput placeholder="confirm password" formControlName="confirmPassword" type="password" required />
        </mat-form-field>
        <div *ngIf="signupForm.get('confirmPassword')?.invalid && signupForm.get('confirmPassword')?.touched"
            class="error-message">
            <div *ngIf="signupForm.get('confirmPassword')?.hasError('required')">
                Confirm password.
            </div>
        </div>
        <div *ngIf="signupForm.hasError('matchPasswordError') && signupForm.get('confirmPassword')?.touched"
            class="error-message">
            Passwords must match.
        </div>
        <app-button label="Log in" class="large" type="submit" [disabled]="signupForm.invalid" />
    </form>
</div>
