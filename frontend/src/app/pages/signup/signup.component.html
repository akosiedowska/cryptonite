<div class="form-wrapper">
    <h2>Create an account</h2>
    <form [formGroup]="signupForm" class="signup-form" (submit)="handleSubmit()">
        <mat-form-field>
            <mat-label>Username</mat-label>
            <input matInput placeholder="enter username" formControlName="username" required />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Email</mat-label>
            <input matInput placeholder="enter email" formControlName="email" required />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Password</mat-label>
            <input matInput placeholder="enter password" formControlName="password" required />
        </mat-form-field>
        <mat-form-field>
            <mat-label>Repeat password</mat-label>
            <input matInput placeholder="repeat password" formControlName="password" required />
        </mat-form-field>
        <app-button label="Log in" class="large" type="submit" />
    </form>
</div>
