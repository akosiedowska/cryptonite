<div class="coin-header" *ngIf="filteredCoin$ | async as coin">
    <img [src]="coin.image" class="coin-header__icon" />
    <h1 class="coin-header__title">{{coin.name}} price ({{coin.symbol}})</h1>
    <mat-icon fontIcon="kid_star" class="material-symbols-outlined"
        [ngClass]="{ 'filled-icon': (favourites$ | async)?.includes(coin.id) }"
        (click)="toggleFavourite(coin.id)"></mat-icon>
</div>

<form [formGroup]="chartForm">
    <mat-form-field class="chart-dropdown">
        <mat-label>Choose time period</mat-label>
        <mat-select formControlName="days" (value)="1">
            <mat-option [value]="1">24h</mat-option>
            <mat-option [value]="30">30d</mat-option>
            <mat-option [value]="365">1y</mat-option>
        </mat-select>
    </mat-form-field>
</form>

<div class="chart-container">
    <highcharts-chart [Highcharts]="Highcharts" [options]="chartOptions" style="width: 100%; height:100%;
     display: block;" (update)='true'></highcharts-chart>
</div>
