<h2>Transactions history</h2>

<table mat-table [dataSource]="(transactions$ | async) ?? []">
    <ng-container matColumnDef="coin-name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let transaction">{{transaction.currency_name}}</td>
    </ng-container>
    <ng-container matColumnDef="transaction-type">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let transaction">{{transaction.transaction_type}}</td>
    </ng-container>
    <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Price</th>
        <td mat-cell *matCellDef="let transaction">&euro;{{transaction.price_per_unit}}</td>
    </ng-container>
    <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let transaction">{{(+transaction.amount).toFixed(2)}}</td>
    </ng-container>
    <ng-container matColumnDef="spent">
        <th mat-header-cell *matHeaderCellDef>Total</th>
        <td mat-cell *matCellDef="let transaction">&euro;{{transaction.total_value}}</td>
    </ng-container>
    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let transaction">{{transaction.transaction_date | date: 'long'}}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns" class="header"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
