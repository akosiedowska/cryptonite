<div class="header-wrapper">
  <div class="header">
    <a routerLink="">
      <div class="header__logo">
        <mat-icon
          aria-hidden="false"
          aria-label="logo icon"
          fontIcon="diamond"
          class="material-icons-outlined"></mat-icon>
        <div class="app-name">Cryptonite</div>
      </div>
    </a>
    <ul class="header__links">
      <li>
        <a
          routerLink=""
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          >About</a
        >
      </li>
      <li><a routerLink="currencies" routerLinkActive="active">Market</a></li>
      @if (user$ | async) {
        <li>
          <a routerLink="dashboard" routerLinkActive="active">Dashboard</a>
        </li>
      }
      <!-- eslint-disable-next-line @angular-eslint/template/no-negated-async -->
      @if (!(user$ | async)) {
        <li>
          <a routerLink="login"><app-button label="Log in" /></a>
        </li>
      }
      <!-- eslint-disable-next-line @angular-eslint/template/no-negated-async -->
      @if (!(user$ | async)) {
        <li>
          <a routerLink="signup"
            ><app-button label="Sign up" [outlined]="true"
          /></a>
        </li>
      }
      @if (user$ | async) {
        <li class="username">Hello, {{ (user$ | async)?.name }}</li>
      }
      @if (user$ | async) {
        <li>
          <app-button label="Log out" (click)="handleLogOut()" />
        </li>
      }

    </ul>
  </div>
</div>
